@font-face{font-family:'Manrope';font-style:normal;font-weight:400 700;font-display:swap;src:url(assets/fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:500 800;font-display:swap;src:url(assets/fonts/plus-jakarta-sans-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#111111; --surface:#1a1a1a; --line:#2a2a2a;
  --text:#f8f8f8; --muted:#a7a7a7; --head:#ffffff;
  --brand:#7d3ed0; --brand-2:#9b5cf0;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-height:100vh; display:flex; flex-direction:column;
  background:var(--bg); color:var(--text);
  font:400 17px/1.65 'Manrope',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* soft brand glow + fine grid in the background */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(600px 420px at 50% 38%, rgba(125,62,208,.28), transparent 70%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/48px 48px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
          mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
  opacity:.9;
}
main{flex:1; display:grid; place-items:center; padding:48px 16px 24px}
.card{max-width:640px; text-align:center}
.logo{
  width:112px; height:112px; margin:0 auto 28px; display:block;
  filter:drop-shadow(0 10px 40px rgba(125,62,208,.55));
  animation:float 5s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-8px)}}
.chip{
  display:inline-flex; align-items:center; gap:8px;
  padding:6px 14px; margin-bottom:22px; border:1px solid var(--line); border-radius:999px;
  background:rgba(255,255,255,.03); color:var(--muted); font-size:14px; letter-spacing:.02em;
  max-width:100%; overflow-wrap:anywhere;
}
.chip i{width:8px; height:8px; border-radius:50%; background:var(--brand-2); box-shadow:0 0 0 0 rgba(155,92,240,.7); animation:pulse 2s infinite; flex:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(155,92,240,0)}100%{box-shadow:0 0 0 0 rgba(155,92,240,0)}}
h1{
  margin:0 0 14px; color:var(--head);
  font:700 clamp(30px,6vw,48px)/1.15 'Plus Jakarta Sans','Manrope',sans-serif; letter-spacing:-.02em;
}
h1 span{white-space:nowrap; background:linear-gradient(90deg,var(--brand-2),#c79bff); -webkit-background-clip:text; background-clip:text; color:transparent}
p.lead{margin:0 auto 32px; max-width:520px; color:var(--muted)}
.btn{
  display:inline-flex; align-items:center; gap:10px; padding:14px 26px; border-radius:12px;
  background:var(--brand); color:#fff; text-decoration:none; font-weight:600;
  transition:background .2s, transform .2s, box-shadow .2s;
  box-shadow:0 8px 30px rgba(125,62,208,.35);
}
.btn:hover{background:var(--brand-2); transform:translateY(-2px)}
.btn:focus-visible{outline:2px solid #c79bff; outline-offset:3px}
.btn svg{width:18px; height:18px}
footer{padding:24px 16px 28px; text-align:center; color:var(--muted); font-size:14px}
footer a{color:var(--text); text-decoration:none; border-bottom:1px solid var(--brand)}
footer a:hover{color:#c79bff}
@media (prefers-reduced-motion:reduce){.logo,.chip i{animation:none}}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="assets/logo.png" width="112" height="112" alt="Zimin.Dev">
    <div class="chip"><i></i><span id="host">site.zimin.dev</span></div>
    <h1 data-i18n="title">Project presentation <span>coming soon</span></h1>
    <p class="lead" data-i18n="lead">This space is reserved for a client project. The presentation will be published here shortly.</p>
    <a class="btn" href="https://zimin.dev" data-i18n="btn">Visit Zimin.Dev
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</main>
<footer>Design &amp; Development by <a href="https://zimin.dev">Sasha Zimin</a> ❤️</footer>
<script>
(function(){
  var h=location.hostname; if(h&&!/^(localhost|127\.|\[)/.test(h)) document.getElementById('host').textContent=h;
  var T={
    uk:{title:'Презентація проєкту <span>скоро</span>',lead:'Тут буде презентація проєкту для клієнта. Вона з’явиться найближчим часом.',btn:'Перейти на Zimin.Dev'},
    de:{title:'Projektpräsentation <span>in Kürze</span>',lead:'Dieser Bereich ist für ein Kundenprojekt reserviert. Die Präsentation erscheint hier in Kürze.',btn:'Zu Zimin.Dev'},
    pl:{title:'Prezentacja projektu <span>wkrótce</span>',lead:'To miejsce jest zarezerwowane dla projektu klienta. Prezentacja pojawi się tu wkrótce.',btn:'Przejdź do Zimin.Dev'},
    fr:{title:'Présentation du projet <span>bientôt</span>',lead:'Cet espace est réservé à un projet client. La présentation sera publiée ici prochainement.',btn:'Visiter Zimin.Dev'},
    ru:{title:'Презентация проекта <span>скоро</span>',lead:'Здесь будет презентация проекта для клиента. Она появится в ближайшее время.',btn:'Перейти на Zimin.Dev'}
  };
  var l=(navigator.languages&&navigator.languages[0]||navigator.language||'en').slice(0,2).toLowerCase(), t=T[l];
  if(!t) return;
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i18n]').forEach(function(e){
    var k=e.getAttribute('data-i18n'), svg=e.querySelector('svg');
    e.innerHTML=t[k]; if(svg){e.append(' ');e.appendChild(svg);}
  });
})();
</script>
</body>
</html>
